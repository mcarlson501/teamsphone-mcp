version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
    ignore:
      # PowerShell 7.5 is built on .NET 9 and 7.6 on .NET 10, and those packages
      # ship only lib/net9.0 and lib/net10.0. On a net8.0 host they restore but
      # fail to compile, so hold the 7.4.x line until the host retargets.
      - dependency-name: Microsoft.PowerShell.SDK
        versions: [">=7.5.0"]
      # Microsoft.Extensions.* 8.0.x is what the ASP.NET Core 8 shared framework
      # carries. Taking 9.x/10.x on a net8.0 app deploys app-local assemblies that
      # override the shared framework for no functional gain, since we only use the
      # abstractions. Track the 8.0.x patch line and revisit when the host retargets.
      - dependency-name: Microsoft.Extensions.*
        versions: [">=9.0.0"]

  # Actions are SHA-pinned, so nothing updates them without this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
