id: list-phone-numbers
version: 1.0.0
summary: List tenant phone numbers with assignment state, number type, and assignment target, optionally filtered by assignment status, number prefix, or acquisition type.
category: read
riskTier: 0
telephonyModels: [callingPlans, operatorConnect, directRouting]
annotations:
  readOnlyHint: true
  destructiveHint: false
  idempotentHint: true
inputs:
  tenantId: { type: string, required: true }
  credentialRef: { type: string, required: true }
  assignmentStatus: { type: string, required: false, allowedValues: [assigned, unassigned, all] }
  numberPrefix: { type: string, required: false }
  numberType: { type: string, required: false, allowedValues: [callingPlan, operatorConnect, directRouting] }
  pageSize: { type: integer, required: false, minimum: 1, maximum: 200 }
  continuationToken: { type: string, required: false }
redactParams: []
maxBlastRadius: 0
timeoutSeconds: 180
