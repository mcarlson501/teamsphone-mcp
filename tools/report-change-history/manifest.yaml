id: report-change-history
version: 1.0.0
summary: Generate a human-readable Markdown or CSV change report from this server's tenant-scoped local audit history.
category: read
riskTier: 0
telephonyModels: []
annotations:
  readOnlyHint: true
  destructiveHint: false
  idempotentHint: true
inputs:
  tenantId: { type: string, required: true }
  fromUtc: { type: string, required: true }
  toUtc: { type: string, required: true }
  format: { type: string, required: true, allowedValues: [markdown, csv] }
redactParams: []
maxBlastRadius: 0
timeoutSeconds: 60