title = "teamsphone-mcp Gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic JWT used to prove audit redaction"
condition = "AND"
targetRules = ["jwt"]
paths = ['''^tests/unit/AuditRedactorTests\.cs$''']
regexTarget = "line"
regexes = ['''const string Jwt =''']

[[allowlists]]
description = "Documented local-only bearer token"
condition = "AND"
targetRules = ["curl-auth-header"]
paths = ['''^docs/testing\.md$''']
regexTarget = "match"
regexes = ['''dev-local-token''']